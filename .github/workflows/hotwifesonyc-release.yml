name: Build HotwifeSonyC Linux release

on:
  push:
    branches: [release/sony-new-20261117-01]
    paths:
      - hotwifesonyc-new/**
      - .github/workflows/hotwifesonyc-release.yml

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hotwifesonyc-new
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      UV_THREADPOOL_SIZE: '1'
      RAYON_NUM_THREADS: '1'
      TOKIO_WORKER_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Integration build
        run: npm run build
      - name: Integration tests
        run: npm run test:integration
      - name: Build production standalone
        env:
          SITE_URL: https://hotwifesonyc.com
          SONY_STANDALONE: '1'
        run: npm run build
      - name: Package without server credentials or persistent data
        run: |
          set -eu
          test "$(find public/images/creator-picks -maxdepth 1 -type f -iname '*.jpeg' | wc -l)" -eq 10
          cp -a .next/standalone "$RUNNER_TEMP/runtime"
          cp -a public content "$RUNNER_TEMP/runtime/"
          cp -a .next/static "$RUNNER_TEMP/runtime/.next/"
          tar -czf "$RUNNER_TEMP/runtime.tar.gz" -C "$RUNNER_TEMP/runtime" .
          sha256sum "$RUNNER_TEMP/runtime.tar.gz" | cut -d' ' -f1 > "$RUNNER_TEMP/runtime.sha256"
          node -e 'const fs=require("node:fs");fs.writeFileSync(process.env.RUNNER_TEMP+"/build.json",JSON.stringify({sourceCommit:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID,node:process.version,creatorPicksPhotos:10,buildId:fs.readFileSync(".next/BUILD_ID","utf8").trim()},null,2))'
      - name: Return package through the existing repository only
        working-directory: .
        run: |
          set -eu
          git switch --orphan "build/sony-new-20261117-01-${GITHUB_SHA:0:12}"
          cp "$RUNNER_TEMP/runtime.tar.gz" "$RUNNER_TEMP/runtime.sha256" "$RUNNER_TEMP/build.json" .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- runtime.tar.gz runtime.sha256 build.json
          git commit -m "Build Linux runtime for $GITHUB_SHA"
          git push origin HEAD
